<div class="onboarding-wrapper d-flex flex-column align-items-center">

  <div class="card blue-border onboarding-card">

    <h5 class="card-header card-header-blue">
      {{ 'onboardingTitle' | translate }}
    </h5>

    <div class="card-body d-flex flex-column">

      <p>{{ 'onboardingIntro' | translate }}</p>

      @if (failed()) {
        <div class="alert alert-danger alert-box" role="alert">
          {{ 'onboardingError' | translate }}
        </div>
      }

      <!-- Step A: choose role -->
      @if (role() === null) {
        <p class="fw-bold">{{ 'onboardingChooseRole' | translate }}</p>
        <div class="d-flex flex-wrap">
          <div class="p-2 half-width">
            <button type="button"
                    class="btn button button-action full-width"
                    (click)="chooseCaregiver()">
              {{ 'onboardingAsCaregiver' | translate }}
            </button>
          </div>
          <div class="p-2 half-width">
            <button type="button"
                    class="btn button button-action full-width"
                    (click)="chooseIndependent()">
              {{ 'onboardingAsIndependent' | translate }}
            </button>
          </div>
        </div>
      }

      <!-- Step B: role-specific fields -->
      @if (role() !== null) {
        <form (ngSubmit)="submit()" #onboardingForm="ngForm">

          @if (role() === 'caregiver') {
            <app-caregiver-type [caregiverType]="caregiverType"></app-caregiver-type>
          }

          @if (role() === 'independent') {
            <div class="mb-3">
              <label class="form-label" for="displayName">
                {{ 'onboardingDisplayName' | translate }}
              </label>
              <input id="displayName" name="displayName" type="text"
                     class="form-control"
                     [(ngModel)]="displayName">
            </div>
            <div class="mb-3">
              <label class="form-label" for="education">
                {{ 'onboardingEducation' | translate }}
              </label>
              <input id="education" name="education" type="text"
                     class="form-control"
                     [(ngModel)]="education">
            </div>
          }

          <div class="d-flex justify-content-start flex-wrap-reverse">
            <div class="p-2 half-width">
              <button type="button"
                      class="btn button button-neutral full-width"
                      (click)="back()">
                <i class="bi bi-caret-left-fill color-white"></i>
                {{ 'goBack' | translate }}
              </button>
            </div>
            <div class="p-2 half-width">
              <button type="submit"
                      class="btn button button-action full-width"
                      [disabled]="submitting() ||
                                  (role() === 'caregiver' &&
                                   caregiverType.type === 'Formal' &&
                                   caregiverType.speciality === '')">
                {{ 'onboardingFinish' | translate }}
                @if (submitting()) {
                  <div class="spinner-border small-spinner-white" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                }
              </button>
            </div>
          </div>

        </form>
      }

    </div>

  </div>

</div>
