<p>toast works!</p>
<!-- (hide)="toastService.remove(toast)" -->
<ngb-toast
    *ngFor="let toast of dialogService.toasts"
        [header]="toast.headertext"
        [class]="toast.classname"
        [autohide]="toast.autohide"
        [delay]="toast.delay || 7500"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
>
    <ng-template [ngIf]="isTemplate(toast)" [ngIfElse]="text">
        <ng-template [ngTemplateOutlet]="toast.textOrTpl"></ng-template>
    </ng-template>

    <ng-template #text>
        <td class="toast-icon">
            <div *ngIf="isSuccess(toast)">
                <i class="bi bi-check-lg color-white"></i>
            </div> 
            <div *ngIf="isError(toast)">
                <i class="bi bi-x-lg color-white"></i>
            </div> 
            <div *ngIf="isInformation(toast)">
                <i class="bi bi-info-lg color-white"></i>
            </div> 
        </td>
        <td>
            <h6 class="toast-text">
                {{ toast.textOrTpl }}
            </h6>
        </td>
    </ng-template>
</ngb-toast>
