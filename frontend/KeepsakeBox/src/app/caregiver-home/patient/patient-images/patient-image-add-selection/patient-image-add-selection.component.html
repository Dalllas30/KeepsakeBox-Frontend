<!--add images-->
<!--First Column of Options-->
<div class="d-flex flex-column justify-content-center">
    <div class="d-flex flex-row justify-content-center">
        <div class="d-flex flex-column"
            style="width: 350px; border-color: #b1b5b9; border-style: solid; border-radius: 3%; border-width: 1px; margin: 10px;">

            <div class="d-flex justify-content-center flex-wrap p-2">
                {{'addFromDeviceOptionDescription' | translate}}
            </div>

            <div class="d-flex justify-content-center flex-wrap p-2" style="margin-top: -10px !important;">

                <!--Add Image Button-->
                <div class="p-2" style="min-width: 300px;">
                    <!--Select Images (Hidden)-->
                    <input type="file" id="addImage" (change)="addImages($event)" class="input-file-hidden" multiple
                        accept="image/*">
                    <!--Select Images-->
                    <label for="addImage" class="p-2 btn button button-action button-width" style="min-width: 300px;">
                        <i class="bi bi-hdd color-white" style="float: left;"></i>
                        {{'addFromDevice' | translate}}
                    </label>
                </div>

            </div>
        </div>

        <!--Second Column of Options-->
        <div class="d-flex flex-column"
            style="width: 350px; border-color: #b1b5b9; border-style: solid; border-radius: 3%; border-width: 1px; margin: 10px;">

            <div class="d-flex justify-content-center flex-wrap p-2">
                {{'onlineSearchOptionDescription' | translate}}
            </div>

            <div class="d-flex justify-content-center flex-wrap p-2" style="margin-top: -10px !important;">
                <!--Search online-->
                <div class="p-2" style="min-width: 300px;">
                    <button type="button" class="p-2 btn button button-action button-width" style="min-width: 300px;"
                        routerLink="/caregiver/person/images/method/online-search">
                        <i class="bi bi-search color-white" style="float: left;"></i>
                        {{'onlineSearch' | translate}}
                    </button>
                </div>

            </div>
        </div>

        <!--Third Column of Options-->
        <div class="d-flex flex-column"
            style="width: 350px; border-color: #b1b5b9; border-style: solid; border-radius: 3%; border-width: 1px; margin: 10px;">

            <div class="d-flex justify-content-center flex-wrap p-2">
                {{'generateRequestOptionDescription' | translate}}
            </div>


            <div class="d-flex justify-content-center flex-wrap p-2" style="margin-top: -10px !important;">
                <!--Ask friends-->
                <div class="p-2" style="min-width: 300px;">
                    <button type="button" class="p-2 btn button button-action button-width" style="min-width: 300px;"
                        routerLink="/caregiver/person/images/method/generate-request">
                        <i class="bi bi-link color-white" style="float: left;"></i>
                        {{'generateRequest' | translate}}
                    </button>
                </div>

            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center flex-wrap p-2" style="margin-top: 50px !important;">
        <button type="button" class="btn button button-neutral" style="min-width: 300px;"
            routerLink="/caregiver/person/images">
            <i class="bi bi-caret-left-fill color-white"></i>
            {{'goBack' | translate}}
        </button>
    </div>
</div>
